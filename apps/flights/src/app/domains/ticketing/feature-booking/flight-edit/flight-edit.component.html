<div>
  <h2>Flight Edit</h2>

  <form>
    <div class="form-group">
      <input [control]="editForm.id" />
    </div>
    <div class="form-group">
      <input [control]="editForm.from" />
    </div>
    <div class="form-group">
      <input [control]="editForm.to" />
    </div>
    <div class="form-group">
      <input [control]="editForm.date" />
    </div>

    <div class="form-group">
      <input id="delayed" [control]="editForm.delayed" type="checkbox" />
      <label for="delayed">Delayed</label>
    </div>

  </form>
  
  <div class="form-group">
    <button (click)="save()" class="btn btn-default">Save</button>
  </div>
  <div class="form-group">
    <button (click)="flightResource.reload()" class="btn btn-default">Reload</button>
  </div>

  <p>Status: {{ flightResource.status() }}</p>
</div>

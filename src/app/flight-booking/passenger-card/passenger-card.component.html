@let passengerValue = passenger();

<div class="card">
  <div class="card-header">
    <h2 class="title">
      {{ passengerValue.firstName }} {{ passengerValue.name }}
    </h2>
  </div>

  <div class="card-body">
    <p>Id: #{{ passengerValue.id }}</p>
    <p>Status: {{ passengerValue.passengerStatus }}</p>
    <p>Miles: {{ passengerValue.bonusMiles }}</p>
    
    <button
      class="btn btn-default"
      [routerLink]="['../passenger-edit', passengerValue.id]"
    >
      Edit
    </button>
  </div>
</div>

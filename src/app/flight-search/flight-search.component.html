<div class="header">
  <h2 class="title">Flight Search</h2>
</div>

<form>
  <div class="form-group">
    <label>From:</label>
    <input [field]="filterForm.from" data-testid="from" class="form-control" />
  </div>
  <div class="form-group">
    <label>To:</label>
    <input [field]="filterForm.to" data-testid="to" class="form-control" />
  </div>

  <div class="form-group">
    <button
      (click)="search()"
      [disabled]="!filter().from || !filter().to"
      class="btn btn-default"
      >
      Search
    </button>
  </div>
</form>

<div class="row">
  @for (f of flights(); track f) {
    <div class="col-xs-12 col-sm-6 col-md-4 col-lg-3">
      <app-flight-card [item]="f" [selected]="basket()[f.id]" (selectedChange)="updateBasket(f.id, $event)">
        <p class="middle"><i>Delays are possible!</i></p>
        <p class="bottom"><small>Statement without guarantee!</small></p>
      </app-flight-card>
    </div>
  }
</div>

<p>&nbsp;</p>

<div>
  <pre>{{ basket() | json }}</pre>
</div>
